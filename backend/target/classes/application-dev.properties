# CampusBridge WebApp - Development Profile Configuration
server.port=8080

# MySQL Development Database
spring.datasource.url=jdbc:mysql://localhost:3306/campus_bridge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@182
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for Dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload configuration (PDF resumes, offer letters)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage path for local development
app.upload.dir=./uploads

# JWT Security
jwt.secret=CampusBridgeSecretKeyForJWTAuthMustBeAtLeast256BitsLongForHMACSHA256Signature12345
jwt.expiration=86400000

# OpenAPI / Swagger Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
